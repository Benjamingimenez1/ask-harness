services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/ask_harness
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ask_harness
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
